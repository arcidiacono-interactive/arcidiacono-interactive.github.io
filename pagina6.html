<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arcidiacono Interactive</title>

<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
  background:#000;
  color:#fff;
  font-family:"Montserrat", sans-serif;
  overflow:hidden;
}

/* AURA + GRANA */
body::before {
  content:"";
  position:fixed;
  inset:0;
  background-image:url("https://www.transparenttextures.com/patterns/asfalt-dark.png");
  opacity:0.10;
  pointer-events:none;
  z-index:1;
}

body::after {
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background:radial-gradient(circle at 50% 40%, rgba(255,0,0,0.22), rgba(0,0,0,0.9) 60%);
  animation:pulse 7s ease-in-out infinite;
  z-index:2;
}

@keyframes pulse {
  0% { opacity:0.55; }
  50% { opacity:0.78; }
  100% { opacity:0.55; }
}

/* CENTRO PAGINA */
.center {
  position:relative;
  z-index:3;
  height:auto;
  padding-top:120px;
  padding-bottom:80px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
}

/* FRACTURED TITLE */
.fractured-title {
    font-family: 'Anton', sans-serif;
    font-size: 6rem;
    letter-spacing: 6px;
    display: flex;
    gap: 4px;
    position: relative;
    margin-bottom: 25px;
    opacity: 0;
    animation: fadeIn 2s forwards;
}

/* LETTERE */
.fractured-title span {
    position: relative;
    display: inline-block;
    padding: 0 2px;
    transition: 0.4s ease;
    filter: drop-shadow(0 0 2px rgba(255,0,0,0.25));
}

/* INCISIONE PROFONDA */
.fractured-title span::before {
    content: "";
    position: absolute;
    left: 48%;
    top: 0;
    width: 6px;
    height: 100%;
    background: rgba(0,0,0,0.35);
    filter: blur(2px);
    opacity: 0.35;
    transform: skewX(-6deg);
    pointer-events: none;
}

/* CREPA ORGANICA */
.fractured-title span::after {
    content: "";
    position: absolute;
    left: 50%;
    top: -12%;
    width: 4px;
    height: 130%;
    background: linear-gradient(
        to bottom,
        rgba(255,255,255,0.9) 0%,
        rgba(255,80,80,0.55) 25%,
        rgba(255,0,0,0.35) 50%,
        rgba(255,80,80,0.55) 75%,
        rgba(255,255,255,0.9) 100%
    );
    clip-path: polygon(
        48% 0%, 52% 3%,
        49% 10%, 54% 18%,
        47% 30%, 53% 42%,
        48% 55%, 52% 68%,
        49% 82%, 53% 94%,
        50% 100%
    );
    filter: blur(1.2px);
    transform: rotate(calc(-6deg + (var(--r) * 3deg)));
    opacity: 1;
    mix-blend-mode: screen;
    pointer-events: none;
}

/* Micro disallineamenti psicologici */
.fractured-title span[data-i="1"]  { transform: translateY(-3px) rotate(-1deg); --r:1; }
.fractured-title span[data-i="2"]  { transform: translateY(2px) rotate(1deg);  --r:2; }
.fractured-title span[data-i="3"]  { transform: translateY(-1px) rotate(-0.5deg); --r:-1; }
.fractured-title span[data-i="4"]  { transform: translateY(3px) rotate(1.2deg); --r:1; }
.fractured-title span[data-i="5"]  { transform: translateY(-2px) rotate(-1deg); --r:-2; }
.fractured-title span[data-i="6"]  { transform: translateY(1px) rotate(0.5deg); --r:1; }
.fractured-title span[data-i="7"]  { transform: translateY(-3px) rotate(-1deg); --r:-1; }
.fractured-title span[data-i="8"]  { transform: translateY(2px) rotate(1deg); --r:2; }
.fractured-title span[data-i="9"]  { transform: translateY(-1px) rotate(-0.5deg); --r:-1; }
.fractured-title span[data-i="10"] { transform: translateY(3px) rotate(1.2deg); --r:1; }
.fractured-title span[data-i="11"] { transform: translateY(-2px) rotate(-1deg); --r:-2; }

/* Hover: la ferita si apre */
.fractured-title span:hover {
    transform: translateY(-6px) rotate(-2deg);
    text-shadow: 0 0 12px rgba(255, 0, 0, 0.35);
}

/* INTERACTIVE */
.logo-interactive {
  font-size:1.1rem;
  letter-spacing:3px;
  margin-left:14px;
  opacity:0;
  animation:fadeIn 2.4s forwards;
}

/* Testo */
.phrase-en {
  font-size:1.4rem;
  margin-top:18px;
  opacity:0;
  animation:fadeIn 2.8s forwards;
  animation-delay:0.4s;
}

.phrase-it {
  font-size:0.95rem;
  margin-bottom:35px;
  opacity:0;
  animation:fadeIn 2.8s forwards;
  animation-delay:0.9s;
}

.micro {
  font-size:0.85rem;
  color:#ccc;
  line-height:1.6;
  margin-bottom:45px;
  opacity:0;
  animation:fadeIn 3.2s forwards;
  animation-delay:1.6s;
}

.menu {
  display:flex;
  gap:28px;
  opacity:0;
  animation:fadeIn 3.2s forwards;
  animation-delay:2.2s;
}

.menu a {
  color:#fff;
  text-decoration:none;
  opacity:0.65;
  transition:0.4s;
}

.menu a:hover {
  opacity:1;
  letter-spacing:1.5px;
}

@keyframes fadeIn { to { opacity:1; } }
</style>
</head>

<body>

  </div>

</html>
