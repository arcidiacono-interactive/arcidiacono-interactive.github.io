<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arcidiacono Interactive</title>

<style>
/* BASE */
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  margin: 0;
  padding: 0;
  background: #000;
  color: #fff;
  font-family: "Montserrat", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  overflow: hidden;
}

/* GRANA + AURA */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  background-image: url("https://www.transparenttextures.com/patterns/asfalt-dark.png");
  opacity: 0.10;
  z-index: 1;
}

body::after {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  background:
    radial-gradient(circle at 50% 40%, rgba(255,0,0,0.22) 0%, rgba(0,0,0,0.85) 60%, rgba(0,0,0,1) 100%);
  animation: pulse 7.5s ease-in-out infinite, drift 22s ease-in-out infinite;
  z-index: 2;
}

@keyframes pulse {
  0%   { opacity: 0.55; }
  50%  { opacity: 0.78; }
  100% { opacity: 0.55; }
}

@keyframes drift {
  0%   { transform: scale(1) translateY(0px); }
  50%  { transform: scale(1.06) translateY(-8px); }
  100% { transform: scale(1) translateY(0px); }
}

/* LAYOUT CENTRALE */
.center {
  position: relative;
  z-index: 3;
  height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
}

/* LOGO */
.logo {
  display: inline-flex;
  align-items: flex-end;
  gap: 6px;
  font-size: 4rem;
  font-weight: 700;
  letter-spacing: 4px;
  text-transform: uppercase;
  opacity: 0;
  animation: fadeIn 2.2s ease-out forwards;
}

/* ARCIDIACONO: lettere con ferita interna */
.arc-word {
  display: inline-flex;
  gap: 2px;
}

/* ogni lettera è un blocco unico */
.letter {
  position: relative;
  display: inline-block;
  color: #ffffff;
  /* trucco per poter usare background-clip: text */
  background: #ffffff;
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
}

/* ferita interna: pseudo-elemento sopra il glifo, ma dentro la forma */
.letter::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  mix-blend-mode: normal;
  opacity: 1;
  /* pattern base: bianco + linea rossa sottile obliqua lunga */
  background-image:
    linear-gradient(
      -65deg,
      transparent 0%,
      transparent 46%,
      rgba(255, 40, 40, 0.18) 48%,
      rgba(255, 40, 40, 0.20) 50%,
      rgba(255, 40, 40, 0.18) 52%,
      transparent 54%,
      transparent 100%
    );
  /* leggero blur per togliere rigidità */
  filter: blur(0.3px);
  /* la ferita segue il glifo perché è “clippata” dal testo */
  -webkit-mask-image: linear-gradient(#000, #000);
  mask-image: linear-gradient(#000, #000);
}

/* variazione posizione ferita per-lettera (più organica) */
.letter[data-shift="1"]::after {
  background-position: -4px 0;
  background-size: 140% 140%;
}
.letter[data-shift="2"]::after {
  background-position: 6px 2px;
  background-size: 130% 130%;
}
.letter[data-shift="3"]::after {
  background-position: -8px -3px;
  background-size: 150% 150%;
}
.letter[data-shift="4"]::after {
  background-position: 3px -4px;
  background-size: 135% 135%;
}
.letter[data-shift="5"]::after {
  background-position: -5px 4px;
  background-size: 145% 145%;
}
.letter[data-shift="6"]::after {
  background-position: 7px 1px;
  background-size: 138% 138%;
}
.letter[data-shift="7"]::after {
  background-position: -6px 3px;
  background-size: 142% 142%;
}
.letter[data-shift="8"]::after {
  background-position: 5px -2px;
  background-size: 148% 148%;
}
.letter[data-shift="9"]::after {
  background-position: -3px -5px;
  background-size: 132% 132%;
}
.letter[data-shift="10"]::after {
  background-position: 4px 5px;
  background-size: 152% 152%;
}
.letter[data-shift="11"]::after {
  background-position: -7px 1px;
  background-size: 136% 136%;
}

/* INTERACTIVE integro */
.logo-interactive {
  font-size: 1.1rem;
  letter-spacing: 3px;
  margin-left: 14px;
  color: #ffffff;
}

/* FADE-IN GENERICO */
@keyframes fadeIn {
  to { opacity: 1; }
}

/* FRASE BILINGUE */
.phrase-en {
  font-size: 1.4rem;
  opacity: 0;
  margin-top: 18px;
  margin-bottom: 6px;
  animation: fadeIn 2.8s ease-out forwards;
  animation-delay: 0.4s;
}

.phrase-it {
  font-size: 0.95rem;
  opacity: 0;
  margin-bottom: 35px;
  animation: fadeIn 2.8s ease-out forwards;
  animation-delay: 0.9s;
}

/* MICRO-MANIFESTO */
.micro {
  font-size: 0.85rem;
  opacity: 0;
  margin-bottom: 45px;
  line-height: 1.6;
  letter-spacing: 0.5px;
  color: #cccccc;
  animation: fadeIn 3.2s ease-out forwards;
  animation-delay: 1.6s;
}

/* MENU */
.menu {
  display: flex;
  gap: 28px;
  font-size: 0.9rem;
  opacity: 0;
  animation: fadeIn 3.2s ease-out forwards;
  animation-delay: 2.2s;
}

.menu a {
  color: #fff;
  text-decoration: none;
  transition: opacity 0.4s, letter-spacing 0.4s;
  opacity: 0.65;
}

.menu a:hover {
  opacity: 1;
  letter-spacing: 1.5px;
}

/* RESPONSIVE MINIMO */
@media (max-width: 768px) {
  .logo {
    font-size: 2.6rem;
    letter-spacing: 2px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .logo-interactive {
    margin-left: 0;
    margin-top: 6px;
    font-size: 0.9rem;
  }
  .phrase-en {
    font-size: 1.1rem;
  }
  .phrase-it {
    font-size: 0.9rem;
  }
  .menu {
    flex-wrap: wrap;
    justify-content: center;
    gap: 16px;
  }
}
</style>
</head>

<body>
<div class="center">

  <!-- LOGO -->
  <div class="logo">
    <div class="arc-word">
      <!-- ARCIDIACONO con ferita interna variabile -->
      <span class="letter" data-shift="1">A</span>
      <span class="letter" data-shift="2">R</span>
      <span class="letter" data-shift="3">C</span>
      <span class="letter" data-shift="4">I</span>
      <span class="letter" data-shift="5">D</span>
      <span class="letter" data-shift="6">I</span>
      <span class="letter" data-shift="7">A</span>
      <span class="letter" data-shift="8">C</span>
      <span class="letter" data-shift="9">O</span>
      <span class="letter" data-shift="10">N</span>
      <span class="letter" data-shift="11">O</span>
    </div>

    <div class="logo-interactive">INTERACTIVE</div>
  </div>

  <!-- FRASE BILINGUE -->
  <div class="phrase-en">After the fracture, a rebirth always follows.</div>
  <div class="phrase-it">Dopo la crepa, segue sempre una rinascita.</div>

  <!-- MICRO-MANIFESTO -->
  <div class="micro">
    Pressione che cresce.<br>
    Silenzi che pesano.<br>
    Emozioni che non trovano spazio.
  </div>

  <!-- MENU -->
  <div class="menu">
    <a href="about.html">ABOUT</a>
    <a href="team.html">TEAM</a>
    <a href="presskit.html">PRESS KIT</a>
    <a href="devlog.html">DEVLOG</a>
    <a href="roadmap.html">ROADMAP</a>
    <a href="social.html">SOCIAL HUB</a>
    <a href="legal.html">LEGAL</a>
  </div>

</div>
</body>
</html>
