<meta charset="UTF-8">

<title>Arcidiacono Interactive</title>

<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
  background:#000;
  color:#fff;
  font-family:"Montserrat", sans-serif;
  overflow:hidden;
}

/* AURA + GRANA */
body::before {
  content:"";
  position:fixed;
  inset:0;
  background-image:url("https://www.transparenttextures.com/patterns/asfalt-dark.png");
  opacity:0.10;
  pointer-events:none;
  z-index:1;
}

body::after {
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background:radial-gradient(circle at 50% 40%, rgba(255,0,0,0.22), rgba(0,0,0,0.9) 60%);
  animation:pulse 7s ease-in-out infinite;
  z-index:2;
}

@keyframes pulse {
  0% { opacity:0.55; }
  50% { opacity:0.78; }
  100% { opacity:0.55; }
}

/* CENTRO PAGINA */
.center {
  position:relative;
  z-index:3;
  height:auto;
  padding-top:120px;
  padding-bottom:80px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
}

/* LOGO */
.logo {
  display:flex;
  align-items:flex-end;
  gap:6px;
  font-size:4rem;
  font-weight:700;
  letter-spacing:4px;
  text-transform:uppercase;
  opacity:0;
  animation:fadeIn 2s forwards;
}

@keyframes fadeIn { to { opacity:1; } }

/* CONTENITORE DELLE LETTERE */
.arc-word {
  display:flex;
  gap:2px;
}

/* LETTERE CHE SI APRONO */
.letter {
  position:relative;
  display:inline-block;
  color:#fff;
}

/* META' DELLA LETTERA */
.letter span {
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
  color:#fff;
  pointer-events:none;
}

/* META' SINISTRA */
.left {
  clip-path:polygon(0 0, 50% 0, 48% 100%, 0 100%);
  transform:translateX(0) rotate(0);
  transition:0.8s ease;
}

/* META' DESTRA */
.right {
  clip-path:polygon(52% 0, 100% 0, 100% 100%, 54% 100%);
  transform:translateX(0) rotate(0);
  transition:0.8s ease;
}

/* FERITA INTERNA */
.letter::after {
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  clip-path:var(--cut);
  background:rgba(255,40,40,0.18);
  box-shadow:
    inset 0 0 2px rgba(0,0,0,0.55),
    inset 0 0 4px rgba(0,0,0,0.35);
  filter:blur(0.4px);
}

/* ANIMAZIONE DI APERTURA */
.letter:hover .left {
  transform:translateX(-3px) rotate(-1deg);
}

.letter:hover .right {
  transform:translateX(3px) rotate(1deg);
}

/* VARIAZIONI PER LETTERA (ferita tremolante + micro-cicatrice) */
.letter[data-i="1"]  { --cut:polygon(48% 0%, 52% 6%, 49% 18%, 53% 32%, 47% 46%, 52% 60%, 49% 74%, 53% 88%, 50% 100%, 46% 92%, 51% 78%, 47% 62%, 52% 44%, 48% 26%, 51% 12%); }
.letter[data-i="2"]  { --cut:polygon(45% 0%, 50% 7%, 47% 20%, 52% 35%, 48% 50%, 53% 65%, 49% 80%, 52% 94%, 50% 100%, 46% 91%, 51% 76%, 48% 59%, 52% 42%, 47% 25%, 50% 11%); }
.letter[data-i="3"]  { --cut:polygon(52% 0%, 48% 8%, 51% 22%, 46% 38%, 50% 54%, 47% 70%, 52% 86%, 49% 100%, 53% 96%, 48% 82%, 51% 66%, 49% 48%, 46% 30%, 51% 16%, 49% 6%); }
.letter[data-i="4"]  { --cut:polygon(49% 0%, 53% 9%, 48% 23%, 52% 39%, 47% 55%, 51% 71%, 49% 87%, 52% 100%, 46% 95%, 50% 81%, 47% 64%, 53% 47%, 48% 29%, 52% 15%, 49% 5%); }
.letter[data-i="5"]  { --cut:polygon(50% 0%, 47% 8%, 52% 21%, 49% 37%, 53% 53%, 48% 69%, 51% 85%, 47% 100%, 52% 97%, 49% 83%, 46% 67%, 51% 51%, 48% 33%, 52% 18%, 50% 7%); }
.letter[data-i="6"]  { --cut:polygon(46% 0%, 51% 7%, 48% 19%, 53% 34%, 49% 49%, 52% 64%, 47% 79%, 50% 94%, 48% 100%, 46% 90%, 51% 75%, 48% 58%, 52% 41%, 47% 24%, 50% 10%); }
.letter[data-i="7"]  { --cut:polygon(53% 0%, 48% 9%, 52% 24%, 47% 40%, 50% 56%, 46% 72%, 52% 88%, 49% 100%, 53% 95%, 48% 80%, 51% 63%, 49% 46%, 46% 28%, 51% 14%, 49% 4%); }
.letter[data-i="8"]  { --cut:polygon(47% 0%, 52% 8%, 49% 22%, 53% 38%, 48% 54%, 51% 70%, 49% 86%, 52% 100%, 46% 96%, 50% 82%, 47% 66%, 53% 50%, 48% 32%, 52% 17%, 49% 6%); }
.letter[data-i="9"]  { --cut:polygon(50% 0%, 47% 7%, 52% 20%, 49% 36%, 53% 52%, 48% 68%, 51% 84%, 47% 100%, 52% 98%, 49% 84%, 46% 68%, 51% 52%, 48% 34%, 52% 19%, 50% 8%); }
.letter[data-i="10"] { --cut:polygon(49% 0%, 53% 8%, 48% 21%, 52% 37%, 47% 53%, 51% 69%, 49% 85%, 52% 100%, 46% 97%, 50% 83%, 47% 67%, 53% 51%, 48% 33%, 52% 18%, 49% 7%); }
.letter[data-i="11"] { --cut:polygon(52% 0%, 48% 9%, 51% 23%, 46% 39%, 50% 55%, 47% 71%, 52% 87%, 49% 100%, 53% 96%, 48% 82%, 51% 66%, 49% 49%, 46% 31%, 51% 16%, 49% 6%); }

</style>
