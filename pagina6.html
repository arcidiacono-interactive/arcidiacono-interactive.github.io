<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arcidiacono Interactive</title>

  <style>
    body {
      background-color: #000;
      color: #fff;
      font-family: 'Montserrat', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      text-align: center;
      overflow-x: hidden;
      margin: 0;
      padding: 0;
    }

    .container {
      padding-top: 10vh;
      padding-left: 20px;
      padding-right: 20px;
    }

    .logo-fractured {
      width: 70%;
      max-width: 760px;
      margin-bottom: 12px;
      opacity: 0;
      animation: fadeIn 1.4s forwards;
      filter: drop-shadow(0 0 25px rgba(255, 60, 60, 0.25));
    }

    .subtitle {
      letter-spacing: 6px;
      font-weight: 300;
      margin-top: -10px;
      font-size: 0.9rem;
      text-transform: uppercase;
      opacity: 0.9;
    }

    .tagline {
      margin-top: 20px;
      font-size: 1.1rem;
      line-height: 1.6;
    }

    .tagline .ita {
      opacity: 0.9;
      font-size: 0.95rem;
    }

    .text-block {
      margin-top: 40px;
      font-size: 1rem;
      line-height: 1.8;
      opacity: 0.9;
    }

    .menu {
      margin-top: 60px;
      font-size: 0.9rem;
      opacity: 0.8;
    }

    .menu a {
      color: #fff;
      text-decoration: none;
      transition: color 0.3s ease;
    }

    .menu a:hover {
      color: #ff3c3c;
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }
  </style>
</head>
<body>

  <div class="container">

    <!-- Logo definitivo -->
    <img src="arcidiacono-interactive-logo.png"
         alt="Arcidiacono Interactive"
         class="logo-fractured">

    <p class="tagline">
      After the fracture, a rebirth always follows.<br>
      <span class="ita">Dopo la crepa, segue sempre una rinascita.</span>
    </p>

    <div class="text-block">
      <p>Pressione che cresce.</p>
      <p>Silenzi che pesano.</p>
      <p>Emozioni che non trovano spazio.</p>
    </div>

    <nav class="menu">
      <a href="about.html">ABOUT</a> |
      <a href="team.html">TEAM</a> |
      <a href="presskit.html">PRESS KIT</a> |
      <a href="devlog.html">DEVLOG</a> |
      <a href="roadmap.html">ROADMAP</a> |
      <a href="socialhub.html">SOCIAL HUB</a> |
      <a href="legal.html">LEGAL</a>
    </nav>

  </div>

</body>
</html>
