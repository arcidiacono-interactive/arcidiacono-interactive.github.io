<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arcidiacono Interactive</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  margin: 0;
  padding: 0;
  background: #000;
  color: #fff;
  font-family: "Montserrat", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  overflow: hidden;
}

/* Grana + aura */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  background-image: url("https://www.transparenttextures.com/patterns/asfalt-dark.png");
  opacity: 0.10;
  z-index: 1;
}

body::after {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  background:
    radial-gradient(circle at 50% 40%, rgba(255,0,0,0.22) 0%, rgba(0,0,0,0.85) 60%, rgba(0,0,0,1) 100%);
  animation: pulse 7.5s ease-in-out infinite, drift 22s ease-in-out infinite;
  z-index: 2;
}

@keyframes pulse {
  0%   { opacity: 0.55; }
  50%  { opacity: 0.78; }
  100% { opacity: 0.55; }
}

@keyframes drift {
  0%   { transform: scale(1) translateY(0px); }
  50%  { transform: scale(1.06) translateY(-8px); }
  100% { transform: scale(1) translateY(0px); }
}

/* Layout centrale */
.center {
  position: relative;
  z-index: 3;
  height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
}

/* LOGO */
.logo {
  display: flex;
  align-items: flex-end;
  gap: 6px;
  font-size: 4rem;
  font-weight: 700;
  letter-spacing: 4px;
  text-transform: uppercase;
  opacity: 0;
  animation: fadeIn 2.2s ease-out forwards;
}

/* ARCIDIACONO: lettere intere ma incise */
.arc-word {
  display: inline-flex;
  gap: 2px;
}

.letter {
  position: relative;
  display: inline-block;
  color: #ffffff;
}

/* Ferita lunga + micro-cicatrice, incisa e bruciata */
.letter::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;

  /* taglio reale dentro la lettera */
  clip-path: var(--cut);

  /* colore ferita (rossa opaca) */
  background: rgba(255, 40, 40, 0.18);

  /* bruciatura sottile (guarito male) */
  box-shadow:
    inset 0 0 2px rgba(0,0,0,0.55),
    inset 0 0 4px rgba(0,0,0,0.35);

  /* tremolatura marcata ma non tamarra */
  filter: blur(0.4px);
}

/* variazioni per-lettera: ferita lunga + micro-cicatrice tremolante */
.letter[data-i="1"]  { --cut: polygon(48% 0%, 52% 6%, 49% 18%, 53% 32%, 47% 46%, 52% 60%, 49% 74%, 53% 88%, 50% 100%, 46% 92%, 51% 78%, 47% 62%, 52% 44%, 48% 26%, 51% 12%); }
.letter[data-i="2"]  { --cut: polygon(45% 0%, 50% 7%, 47% 20%, 52% 35%, 48% 50%, 53% 65%, 49% 80%, 52% 94%, 50% 100%, 46% 91%, 51% 76%, 48% 59%, 52% 42%, 47% 25%, 50% 11%); }
.letter[data-i="3"]  { --cut: polygon(52% 0%, 48% 8%, 51% 22%, 46% 38%, 50% 54%, 47% 70%, 52% 86%, 49% 100%, 53% 96%, 48% 82%, 51% 66%, 49% 48%, 46% 30%, 51% 16%, 49% 6%); }
.letter[data-i="4"]  { --cut: polygon(49% 0%, 53% 9%, 48% 23%, 52% 39%, 47% 55%, 51% 71%, 49% 87%, 52% 100%, 46% 95%, 50% 81%, 47% 64%, 53% 47%, 48% 29%, 52% 15%, 49% 5%); }
.letter[data-i="5"]  { --cut: polygon(50% 0%, 47% 8%, 52% 21%, 49% 37%, 53% 53%, 48% 69%, 51% 85%, 47% 100%, 52% 97%, 49% 83%, 46% 67%, 51% 51%, 48% 33%, 52% 18%, 50% 7%); }
.letter[data-i="6"]  { --cut: polygon(46% 0%, 51% 7%, 48% 19%, 53% 34%, 49% 49%, 52% 64%, 47% 79%, 50% 94%, 48% 100%, 46% 90%, 51% 75%, 48% 58%, 52% 41%, 47% 24%, 50% 10%); }
.letter[data-i="7"]  { --cut: polygon(53% 0%, 48% 9%, 52% 24%, 47% 40%, 50% 56%, 46% 72%, 52% 88%, 49% 100%, 53% 95%, 48% 80%, 51% 63%, 49% 46%, 46% 28%, 51% 14%, 49% 4%); }
.letter[data-i="8"]  { --cut: polygon(47% 0%, 52% 8%, 49% 22%, 53% 38%, 48% 54%, 51% 70%, 49% 86%, 52% 100%, 46% 96%, 50% 82%, 47% 66%, 53% 50%, 48% 32%, 52% 17%, 49% 6%); }
.letter[data-i="9"]  { --cut: polygon(50% 0%, 47% 7%, 52% 20%, 49% 36%, 53% 52%, 48% 68%, 51% 84%, 47% 100%, 52% 98%, 49% 84%, 46% 68%, 51% 52%, 48% 34%, 52% 19%, 50% 8%); }
.letter[data-i="10"] { --cut: polygon(49% 0%, 53% 8%, 48% 21%, 52% 37%, 47% 53%, 51% 69%, 49% 85%, 52% 100%, 46% 97%, 50% 83%, 47% 67%, 53% 51%, 48% 33%, 52% 18%, 49% 7%); }
.letter[data-i="11"] { --cut: polygon(52% 0%, 48% 9%, 51% 23%, 46% 39%, 50% 55%, 47% 71%, 52% 87%, 49% 100%, 53% 96%, 48% 82%, 51% 66%, 49% 49%, 46% 31%, 51% 16%, 49% 6%); }

/* INTERACTIVE integro */
.logo-interactive {
  font-size: 1.1rem;
  letter-spacing: 3px;
  margin-left: 14px;
  color: #ffffff;
}

/* Fade-in */
@keyframes fadeIn {
  to { opacity: 1; }
}

/* Frase bilingue */
.phrase-en {
  font-size: 1.4rem;
  opacity: 0;
  margin-top: 18px;
  margin-bottom: 6px;
  animation: fadeIn 2.8s ease-out forwards;
  animation-delay: 0.4s;
}

.phrase-it {
  font-size: 0.95rem;
  opacity: 0;
  margin-bottom: 35px;
  animation: fadeIn 2.8s ease-out forwards;
  animation-delay: 0.9s;
}

/* Micro-manifesto */
.micro {
  font-size: 0.85rem;
  opacity: 0;
  margin-bottom: 45px;
  line-height: 1.6;
  letter-spacing: 0.5px;
  color: #cccccc;
  animation: fadeIn 3.2s ease-out forwards;
  animation-delay: 1.6s;
}

/* Menu */
.menu {
  display: flex;
  gap: 28px;
  font-size: 0.9rem;
  opacity: 0;
  animation: fadeIn 3.2s ease-out forwards;
  animation-delay: 2.2s;
}

.menu a {
  color: #fff;
  text-decoration: none;
  transition: opacity 0.4s, letter-spacing 0.4s;
  opacity: 0.65;
}

.menu a:hover {
  opacity: 1;
  letter-spacing: 1.5px;
}

/* Responsive minimo */
@media (max-width: 768px) {
  .logo {
    font-size: 2.6rem;
    letter-spacing: 2px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .logo-interactive {
    margin-left: 0;
    margin-top: 6px;
    font-size: 0.9rem;
  }
  .phrase-en {
    font-size: 1.1rem;
  }
  .phrase-it {
    font-size: 0.9rem;
  }
  .menu {
    flex-wrap: wrap;
    justify-content: center;
    gap: 16px;
  }
}
</style>
</head>

<body>
<div class="center">

  <!-- LOGO -->
  <div class="logo">
    <div class="arc-word">
      <span class="letter" data-i="1">A</span>
      <span class="letter" data-i="2">R</span>
      <span class="letter" data-i="3">C</span>
      <span class="letter" data-i="4">I</span>
      <span class="letter" data-i="5">D</span>
      <span class="letter" data-i="6">I</span>
      <span class="letter" data-i="7">A</span>
      <span class="letter" data-i="8">C</span>
      <span class="letter" data-i="9">O</span>
      <span class="letter" data-i="10">N</span>
      <span class="letter" data-i="11">O</span>
    </div>

    <div class="logo-interactive">INTERACTIVE</div>
  </div>

  <!-- Frase bilingue -->
  <div class="phrase-en">After the fracture, a rebirth always follows.</div>
  <div class="phrase-it">Dopo la crepa, segue sempre una rinascita.</div>

  <!-- Micro-manifesto -->
  <div class="micro">
    Pressione che cresce.<br>
    Silenzi che pesano.<br>
    Emozioni che non trovano spazio.
  </div>

  <!-- Menu -->
  <div class="menu">
    <a href="about.html">ABOUT</a>
    <a href="team.html">TEAM</a>
    <a href="presskit.html">PRESS KIT</a>
    <a href="devlog.html">DEVLOG</a>
    <a href="roadmap.html">ROADMAP</a>
    <a href="social.html">SOCIAL HUB</a>
    <a href="legal.html">LEGAL</a>
  </div>

</div>
</body>
</html>
