<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arcidiacono Interactive</title>

<style>

/* Reset + sfondo */
body {
  margin: 0;
  padding: 0;
  background: #000;
  color: #fff;
  font-family: "Montserrat", sans-serif;
  overflow: hidden;
}

/* Grana cinematografica */
body::before {
  content: "";
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  background-image: url("https://www.transparenttextures.com/patterns/asfalt-dark.png");
  opacity: 0.10;
  z-index: 1;
}

/* Aura psicologica + pulsazione emotiva */
body::after {
  content: "";
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;

  background:
    radial-gradient(circle at 50% 40%, rgba(255,0,0,0.22) 0%, rgba(0,0,0,0.85) 60%, rgba(0,0,0,1) 100%);

  animation: pulse 7.5s ease-in-out infinite, drift 22s ease-in-out infinite;
  z-index: 2;
}

/* Pulsazione emotiva */
@keyframes pulse {
  0%   { opacity: 0.55; }
  50%  { opacity: 0.78; }
  100% { opacity: 0.55; }
}

/* Movimento mentale lentissimo */
@keyframes drift {
  0%   { transform: scale(1) translateY(0px); }
  50%  { transform: scale(1.06) translateY(-8px); }
  100% { transform: scale(1) translateY(0px); }
}

/* Contenitore centrale */
.center {
  position: relative;
  z-index: 3;
  height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
}

/* LOGO CON FERITE ROSSE */
.logo {
  font-size: 4rem;
  letter-spacing: 4px;
  font-weight: 700;
  margin-bottom: 25px;
  text-transform: uppercase;
  position: relative;
  opacity: 0;
  animation: fadeIn 2.2s ease-out forwards;
}

/* Ferite rosse statiche */
.logo::after {
  content: "";
  position: absolute;
  inset: 0;
  background-image:
    url("data:image/svg+xml;utf8,\
    <svg xmlns='http://www.w3.org/2000/svg' width='600' height='150'>\
      <path d='M10 40 Q60 10 120 50 T240 40 T360 60 T480 30' stroke='%23ff3b3b' stroke-width='2' fill='none'/>\
      <path d='M80 90 Q140 60 200 100 T320 80 T440 110' stroke='%23ff3b3b' stroke-width='1.6' fill='none'/>\
      <path d='M30 120 Q90 80 150 130 T300 120 T450 140' stroke='%23ff3b3b' stroke-width='1.4' fill='none'/>\
    </svg>");
  background-size: cover;
  background-repeat: no-repeat;
  background-position: center;
  mix-blend-mode: screen;
  opacity: 0.18;
  filter: blur(0.6px);
  pointer-events: none;
}

/* Frase bilingue */
.phrase-en {
  font-size: 1.4rem;
  opacity: 0;
  margin-bottom: 6px;
  animation: fadeIn 2.8s ease-out forwards;
  animation-delay: 0.4s;
}

.phrase-it {
  font-size: 0.95rem;
  opacity: 0;
  margin-bottom: 35px;
  animation: fadeIn 2.8s ease-out forwards;
  animation-delay: 0.9s;
}

/* Micro-manifesto psicologico */
.micro {
  font-size: 0.85rem;
  opacity: 0;
  margin-bottom: 45px;
  line-height: 1.6;
  letter-spacing: 0.5px;
  color: #cccccc;
  animation: fadeIn 3.2s ease-out forwards;
  animation-delay: 1.6s;
}

/* Menu */
.menu {
  display: flex;
  gap: 28px;
  font-size: 0.9rem;
  opacity: 0;
  animation: fadeIn 3.2s ease-out forwards;
  animation-delay: 2.2s;
}

.menu a {
  color: #fff;
  text-decoration: none;
  transition: opacity 0.4s, letter-spacing 0.4s;
  opacity: 0.65;
}

.menu a:hover {
  opacity: 1;
  letter-spacing: 1.5px;
}

/* Fade-in generico */
@keyframes fadeIn {
  to { opacity: 1; }
}

</style>
</head>

<body>

<div class="center">

  <!-- LOGO -->
  <div class="logo">ARCIDIACONO INTERACTIVE</div>

  <!-- FRASE BILINGUE -->
  <div class="phrase-en">After the fracture, a rebirth always follows.</div>
  <div class="phrase-it">Dopo la crepa, segue sempre una rinascita.</div>

  <!-- MICRO-MANIFESTO PSICOLOGICO -->
  <div class="micro">
    Pressione che cresce.<br>
    Silenzi che pesano.<br>
    Emozioni che non trovano spazio.
  </div>

  <!-- MENU -->
  <div class="menu">
    <a href="about.html">ABOUT</a>
    <a href="team.html">TEAM</a>
    <a href="presskit.html">PRESS KIT</a>
    <a href="devlog.html">DEVLOG</a>
    <a href="roadmap.html">ROADMAP</a>
    <a href="social.html">SOCIAL HUB</a>
    <a href="legal.html">LEGAL</a>
  </div>

</div>

</body>
</html>
